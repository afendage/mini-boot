server:
  port: 8080

spring:
  application:
    name: gateway-service

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@userKeyResolver}"

        - id: login-service
          uri: http://localhost:8082
          predicates:
            - Path=/login/**
          filters:
            - StripPrefix=1

        - id: email-service
          uri: http://localhost:8083
          predicates:
            - Path=/email/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                key-resolver: "#{@ipKeyResolver}"

        - id: export-service
          uri: http://localhost:8084
          predicates:
            - Path=/export/**
          filters:
            - StripPrefix=1

        - id: operator-log
          uri: http://localhost:8085
          predicates:
            - Path=/log/**
          filters:
            - StripPrefix=1

      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@ipKeyResolver}"

      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.finger: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/gateway-service.log
    max-size: 100MB
    max-history: 30

# CORS配置
cors:
  # 生产环境应该设置具体的域名，多个域名用逗号分隔
  # 例如: "http://localhost:3000,https://yourdomain.com"
  allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  # 生产环境应该设置为false，防止跨域请求携带凭证导致安全问题
  allow-credentials: false
  max-age: 3600

# JWT配置
jwt:
  # 从环境变量JWT_SECRET读取，如果没有设置则使用默认值（仅用于开发）
  # 生产环境必须设置环境变量：JWT_SECRET=你的安全密钥
  secret: "${JWT_SECRET:bXlTZWNyZXRLZXkxMjM0NTY3ODkwYWJjZGVmZ2hpams=}"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
