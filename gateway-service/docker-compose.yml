version: '3.8'

services:
  # Redis 服务 - 用于分布式限流和缓存
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    volumes:
      # Redis 数据持久化到本地
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-network

  # 网关服务 - API 网关
  gateway:
    build: .
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      # JWT 密钥（必须设置为安全的值）
      JWT_SECRET: "bXlTZWNyZXRLZXkxMjM0NTY3ODkwYWJjZGVmZ2hpams="
      # CORS 允许的源
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      # Redis 连接地址
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gateway-network
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:

networks:
  gateway-network:
    driver: bridge
